databases:
  - name: alblingo-db
    databaseName: alblingo
    plan: free

services:
  - type: web
    name: alblingo-backend
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /health
    buildCommand: pip install -r requirements-prod.txt
    # Bind immediately; schema setup happens after /health is reachable.
    startCommand: gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 30 --keep-alive 5 --access-logfile - --error-logfile -
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: alblingo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://alblingo.vercel.app,https://alb-greta-ahma.vercel.app"
      - key: ENABLE_EMAIL_NOTIFICATIONS
        value: "true"
      - key: ENABLE_BACKGROUND_TASKS
        value: "true"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        value: "AlbLingo Platform"
      - key: APP_URL
        value: "https://alb-greta-ahma.vercel.app"
      - key: PYTHON_VERSION
        value: "3.11.6"
